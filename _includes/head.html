<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      document.querySelector('meta[name="color-scheme"]').content = localStorage.getItem("color-scheme") ?? "light dark";
    } catch (e) {}
  </script>
  <title>{{ page.title }}</title>
  {% include opengraph.html %}
  <meta name="description" content="{{ page.description | default: site.github.project_tagline }}">
  <meta property="fb:app_id" content="{{ page.fblike | default: '316524268514389' }}" />
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}" />
  <meta name="keywords" content="{{ page.keywords }}"/>
  <meta name="robots" content="index,follow" />
  <meta name="author" content="duclvzz@gmail.com">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090D16" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#10B981" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="google-site-verification" content="{{site.google_site_verification}}" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
</head>
